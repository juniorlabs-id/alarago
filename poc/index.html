<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AlaraGo · Uji Coba Arsitektur Baru</title>
  <meta name="theme-color" content="#F5F5F2">
  <link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .poc{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
    .poc .step{display:flex;gap:10px;align-items:center}
    .poc .step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--y-t);color:var(--y-deep);font:800 14px var(--fh)}
    .poc .ok .n{background:var(--ok);color:#fff}
    .log{border-radius:14px;margin:0 20px 20px;background:#2F2F35;color:#d7dbe0;font:12px/1.6 var(--fm);padding:12px;max-height:260px;overflow:auto;white-space:pre-wrap}
    .log b{color:#FFC21A}
    .stg input{width:110px}
    .wk{max-width:480px;margin:0 auto;padding:20px 16px 60px}
  </style>
</head>
<body>
  <div id="root"><div class="center-wrap"><div class="sk" style="width:200px"></div></div></div>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/util.js"></script>
  <script src="../js/vendor/qrcode.min.js"></script>
  <script src="poc.js"></script>
</body>
</html>
